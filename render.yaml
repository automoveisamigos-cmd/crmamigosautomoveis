services:
  - type: web
    name: crm-amigos-backend
    runtime: node
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MOBIAUTO_TOKEN
        sync: false
      - key: NAPISTA_USER
        sync: false
      - key: NAPISTA_PASS
        sync: false
      - key: WEBMOTORS_TOKEN
        sync: false
      - key: NODE_ENV
        value: production

  - type: static
    name: crm-amigos-frontend
    runtime: static
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        value: https://crm-amigos-backend.onrender.com/api

